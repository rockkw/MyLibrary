[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mylibrary"
version = "0.1.0"
description = "Local, LLM-assisted movie library organizer that never deletes files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["guessit>=3.8", "flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mylib = "mylibrary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mylibrary.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
